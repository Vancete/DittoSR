; DittoSR settings, next to the DLL. Read when the game starts; F9 reads them again while playing.
[dittosr]
; The DittoSR version these settings were written for (the loader and the install scripts update them by it).
version=0.4.1
; 1: the game's FSR option renders through DittoSR. 0: AMD's FSR instead (needs AMD's DLL alongside as <name>.orig.dll).
enabled=1
; Sharpness, 0 - 1. At rest: 0 soft, 0.6 the image as reconstructed, 1 sharpened. Moving: sharpened, more the higher.
sharpness=0.6
; The weight of each new frame against the accumulated image, 0.25 - 4.
;   lower (0.5): more persistence - steadier and smoother, slightly blurrier and with more trailing in motion
;   higher (3): more responsive - crisper in motion, more shimmer and noise
frame_weight=2.0

[debug]
; 1: F10 switches DittoSR <-> AMD's FSR live (with AMD's DLL alongside), and dittosr.log describes the first upscales in full.
enabled=0
; 1: a small pink DittoSR face in the top-left corner while DittoSR upscales.
indicator=0
